<!DOCTYPE html>
<html>
   <head>
      <meta charset="UTF-8">
  
      <!-- CSS -->
      <link rel="stylesheet" href="css/common.css" />
      <link rel="stylesheet" href="css/omnibar.css" />
      <style>
         body {
         background: url('img/layouts/Omnibar.png') no-repeat;
         }
      </style>
  
      <!-- JavaScript -->
      <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
      <script src="js/layouts/omnibar.js"></script>
      <script src="js/layouts/intermission.js"></script>
      <script src="js/utils.js"></script>
   </head>
   <body>
      <div id="omnibar">
         <div id="event-name"><p>PSR Marathon 2026</p></div>
         <div id="omnibar-content" class="omnibar-item"></div>
      </div>

      <!-- Next Run -->
      <div id="up-next-label"></div>
      <div id="up-next-game"></div>
      <div id="up-next-info-container">
         <div class="info" id="up-next-info"></div>
         <div id="estimate-container">
            <div id="estimate-label">
               <img src="img/common/timer.svg" />
            </div>
            <div class="estimate" id="up-next-estimate"></div>
         </div>
      </div>

      <!-- On Deck Runs -->
      <div id="on-deck-label1"></div>
      <div class="on-deck-game" id="on-deck-game1"></div>
      <div id="on-deck-info-container1">
         <div class="info" id="on-deck-info1"></div>
         <div id="estimate-container">
            <div id="estimate-label">
               <img src="img/common/timer.svg" />
            </div>
            <div class="estimate" id="on-deck-estimate1"></div>
         </div>
      </div>
   </body>
</html>
